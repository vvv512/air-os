<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIR OS">
<meta name="theme-color" content="#8fd3ff">
<title>AIR OS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#cfeaff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#phone{position:fixed;inset:0;overflow:hidden;color:var(--ink);--ink:#17325c;--glass:rgba(255,255,255,.5);--glassb:rgba(255,255,255,.8);--paper:#fbf8f1;--card:#fff;--line:rgba(23,50,92,.14);--accent:#2b8cff}
#phone[data-theme=sunset]{--ink:#4a1d3a}
#phone[data-theme=night],#phone[data-tone=dark]{--ink:#f2f5ff;--glass:rgba(255,255,255,.14);--glassb:rgba(255,255,255,.22);--paper:#1a2138;--card:#263050;--line:rgba(255,255,255,.16)}

/* wallpaper */
.wall{position:absolute;top:0;bottom:0;left:-60px;right:-60px;background:linear-gradient(180deg,#6cc3ff 0%,#a9e0ff 45%,#f2fbff 100%);background-size:cover;background-position:center;transition:background .8s}
[data-theme=sunset] .wall{background:linear-gradient(180deg,#ff9a8b 0%,#ffc9a0 45%,#fff0d8 100%)}
[data-theme=night] .wall{background:linear-gradient(180deg,#0a1030 0%,#1d2a5e 55%,#3a3f85 100%)}
[data-theme=photo] .cloud,[data-theme=photo] .fly{display:none}
.cloud{position:absolute;width:260px;height:90px;border-radius:90px;background:#fff;filter:blur(14px);opacity:.85;animation:drift linear infinite}
[data-theme=night] .cloud{opacity:.12}
@keyframes drift{from{transform:translateX(-340px)}to{transform:translateX(130vw)}}
.fly{position:absolute;width:30px;opacity:.75;animation:flyby linear infinite}
@keyframes flyby{from{transform:translate(-60px,0) rotate(-12deg)}50%{transform:translate(50vw,-60px) rotate(8deg)}to{transform:translate(115vw,-10px) rotate(-12deg)}}
.stars{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 15%,#fff,transparent),radial-gradient(2px 2px at 70% 25%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 60%,#fff,transparent),radial-gradient(2px 2px at 85% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 80%,#fff,transparent)}
[data-theme=night] .stars{opacity:1;animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.4}}

#status{position:absolute;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 34px);padding:calc(env(safe-area-inset-top) + 8px) 26px 0;display:flex;justify-content:space-between;font-size:15px;font-weight:700;z-index:60}
#status .r{display:flex;gap:6px;align-items:center}
#snote{animation:bob2 1s infinite alternate}
@keyframes bob2{to{transform:translateY(-3px)}}
.bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;padding:1px;opacity:.8}
.bat i{display:block;height:100%;width:80%;background:currentColor;border-radius:2px}
.bat:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}

/* lock */
#lock{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s;touch-action:none}
#lock.dragging{transition:none}
#lock.gone{transform:translateY(-100%) scale(1.05);opacity:0;pointer-events:none}
#lock .brand{margin-top:calc(env(safe-area-inset-top) + 50px);font-size:13px;letter-spacing:6px;font-weight:800;opacity:.7}
#lock .date{margin-top:12px;font-size:20px;font-weight:600;text-transform:capitalize}
#lock .time{font-size:100px;font-weight:800;letter-spacing:-4px;line-height:1.05;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-6px);letter-spacing:-2px}}
#lgreet{font-size:18px;opacity:.85;margin-top:2px;min-height:24px}
#lock .plane{margin-top:14px;width:60px;animation:hover 3.5s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translate(-30px,6px) rotate(-8deg)}50%{transform:translate(30px,-12px) rotate(8deg)}}
#lnotes{width:calc(100% - 32px);margin-top:16px;display:flex;flex-direction:column;gap:8px}
#lock .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 38px);text-align:center;font-size:15px;font-weight:600;animation:bob 1.8s ease-in-out infinite}
#lock .hint b{display:block;font-size:26px}
@keyframes bob{50%{transform:translateY(-10px);opacity:.5}}
.lockbar{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 10px);width:140px;height:5px;border-radius:3px;background:var(--ink)}
.nt{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:20px;background:var(--glassb);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 24px rgba(20,40,90,.18);color:var(--ink);text-align:left}
.nt .e{font-size:26px}.nt b{font-size:14px;display:block}.nt span{font-size:13px;opacity:.8;display:block}

/* home */
#home{position:absolute;inset:0;z-index:10;transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .45s,opacity .45s}
#home.away{transform:scale(.92);filter:blur(8px);opacity:.35}
#pager{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 52px);bottom:calc(env(safe-area-inset-bottom) + 150px);display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pager::-webkit-scrollbar{display:none}
.page{flex:none;width:100%;scroll-snap-align:start;padding:0 18px 16px;overflow-y:auto}
.widget{height:112px;border-radius:30px;margin:2px 4px 14px;padding:16px 20px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.6);display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 30px rgba(30,70,130,.18);position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.widget:active{transform:scale(.96)}
.widget .t{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1}
.widget .s{font-size:14px;opacity:.8;margin-top:3px;font-weight:600}
.widget svg{width:66px;animation:hover 4s ease-in-out infinite}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 4px 14px}
.widget.sm{margin:0;flex-direction:column;align-items:flex-start;justify-content:center;padding:12px 16px;gap:2px}
.cwk{font-size:12px;font-weight:900;letter-spacing:2px;color:#ff4d4d}
.cwd{font-size:44px;font-weight:800;line-height:1}
.ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:background .5s}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:800}
.sect{font-size:12px;font-weight:800;letter-spacing:2px;opacity:.6;margin:0 6px 8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:16px;margin-bottom:14px;min-height:80px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;cursor:pointer;transition:transform .15s;text-align:center;line-height:1.1;position:relative}
.ic:active{transform:scale(.86)}
.ico{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;box-shadow:0 8px 16px rgba(30,60,110,.28),inset 0 1px 0 rgba(255,255,255,.5);position:relative;overflow:hidden}
.ico:before{content:"";position:absolute;top:0;right:0;width:17px;height:17px;background:linear-gradient(225deg,transparent 50%,rgba(255,255,255,.92) 50%);box-shadow:-2px 2px 4px rgba(0,0,0,.18);border-bottom-left-radius:5px;z-index:2}
.ico svg{width:34px;height:34px;position:relative;z-index:1}
.ico .em{font-size:32px;position:relative;z-index:1}
#home.pop .ic,#home.pop .widget{animation:pop .65s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.3) translateY(60px) rotate(-6deg);opacity:0}}
.ic.dying{animation:die .35s forwards}
@keyframes die{to{transform:scale(0) rotate(40deg);opacity:0}}
#dots{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 126px);display:flex;justify-content:center;gap:8px}
#dots i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.25;transition:all .3s}
#dots i.on{opacity:.85;width:20px;border-radius:4px}
.dock{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:14px 12px;border-radius:34px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid rgba(255,255,255,.6);display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 12px 30px rgba(30,70,130,.2)}
.dock .ic>span{display:none}
/* edit mode */
.x{display:none;position:absolute;top:-7px;left:2px;width:22px;height:22px;border-radius:50%;background:rgba(40,45,60,.75);color:#fff;font-size:12px;place-items:center;z-index:5;font-weight:900}
.editing .grid .ic .x{display:grid}
.editing .grid .ic:nth-child(odd) .ico{animation:jig .22s infinite alternate}
.editing .grid .ic:nth-child(even) .ico{animation:jig .27s infinite alternate-reverse}
@keyframes jig{from{transform:rotate(-2.4deg)}to{transform:rotate(2.4deg)}}
#doneBtn{display:none;position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 40px);z-index:62;border:0;border-radius:20px;padding:8px 18px;font-weight:800;font-size:15px;color:var(--ink);background:var(--glassb);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 4px 14px rgba(0,0,0,.18);font-family:inherit}
.editing #doneBtn{display:block;animation:pop .4s both}
.ghost{position:fixed;z-index:150;pointer-events:none;transform:scale(1.18);filter:drop-shadow(0 12px 14px rgba(0,0,0,.35))}

/* app window */
#app{position:absolute;inset:0;z-index:30;background:var(--paper);color:var(--ink);border-radius:44px;overflow:hidden;display:none;flex-direction:column;transform-origin:0 0;will-change:transform;box-shadow:0 0 60px rgba(0,0,0,.3)}
#app.open{display:flex}
#app .bar{height:calc(env(safe-area-inset-top) + 34px);flex:none}
#app .body{flex:1;overflow:hidden;position:relative}
#app .home-ind{height:calc(env(safe-area-inset-bottom) + 28px);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
#app .home-ind i{width:140px;height:5px;border-radius:3px;background:var(--ink);opacity:.8}
.pad{padding:8px 18px;height:100%;overflow:auto}
.pad h2{margin:2px 0 12px;font-size:28px}
.btn{border:0;border-radius:22px;padding:12px 22px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#2b8cff,#6a5cff);box-shadow:0 6px 16px rgba(60,90,255,.35);font-family:inherit;transition:transform .12s}
.btn:active{transform:scale(.93)}
.btn.g{background:var(--card);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.card{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 3px 12px rgba(30,60,110,.1);margin-bottom:10px;animation:cardin .35s both}
@keyframes cardin{from{transform:translateY(14px);opacity:0}}
input.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:13px 14px;font-size:17px;outline:none;font-family:inherit;-webkit-user-select:text;user-select:text}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;text-align:center;padding:20px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(251,248,241,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5;text-align:center;padding:20px}
[data-theme=night] .ov,[data-tone=dark] .ov{background:rgba(26,33,56,.85)}
.hud{display:flex;justify-content:center;gap:26px;font-size:20px;font-weight:800;padding:6px}
.row{display:flex;gap:10px;align-items:center}

/* calc */
.calc{height:100%;display:flex;flex-direction:column;background:#000;color:#fff;padding:0 14px 6px}
.calc .disp{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;font-size:74px;font-weight:300;padding:0 10px 10px;word-break:break-all;text-align:right;line-height:1}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.calc button{aspect-ratio:1;border:0;border-radius:50%;font-size:30px;color:#fff;background:#333;font-family:inherit;transition:transform .1s,filter .2s}
.calc button:active{transform:scale(.9);filter:brightness(1.5)}
.calc .f{background:#a5a5a5;color:#000}.calc .o{background:linear-gradient(135deg,#2b8cff,#6a5cff)}
.calc .z{grid-column:span 2;aspect-ratio:auto;border-radius:40px;text-align:left;padding-left:30px}
/* games */
.g2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--line);padding:8px;border-radius:18px;width:min(86vw,380px);aspect-ratio:1;margin:0 auto;touch-action:none}
.g2048 div{border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:clamp(20px,7vw,34px);background:rgba(255,255,255,.35);color:#fff}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(88vw,380px);margin:0 auto}
.mc{aspect-ratio:1;perspective:600px}
.mc div{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s}
.mc.f div{transform:rotateY(180deg)}
.mc span{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:34px}
.mc .a{background:linear-gradient(135deg,#2b8cff,#6a5cff);box-shadow:0 4px 10px rgba(60,90,255,.3)}
.mc .b{background:var(--card);transform:rotateY(180deg);box-shadow:0 4px 10px rgba(0,0,0,.12)}
.mc.m .b{background:#c9f5d4}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(80vw,320px);margin:0 auto}
.ttt button{aspect-ratio:1;border:0;border-radius:20px;background:var(--card);font-size:56px;font-weight:900;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.1);font-family:inherit}
.pot{position:absolute;font-size:52px;animation:spawn .25s cubic-bezier(.2,1.6,.4,1);transition:transform .15s,opacity .15s}
@keyframes spawn{from{transform:scale(0) rotate(-90deg)}}
.plus{position:absolute;font-weight:900;font-size:22px;color:#ff8a00;pointer-events:none;animation:up .7s forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs .btn{flex:1;padding:9px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.cal b{text-align:center;font-size:12px;opacity:.6}
.cal button{aspect-ratio:1;border:0;border-radius:50%;background:transparent;color:var(--ink);font-size:16px;font-weight:700;position:relative;font-family:inherit;transition:transform .15s}
.cal button:active{transform:scale(.85)}
.cal .today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .sel{background:var(--accent);color:#fff}
.cal .has:after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#ff6a3d}
/* tasks */
.task{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600}
.task input{width:24px;height:24px;accent-color:var(--accent)}
.task.done span{text-decoration:line-through;opacity:.5}
.task .rm{margin-left:auto;border:0;background:none;font-size:18px;opacity:.5;color:var(--ink)}
/* music */
.disc{width:170px;height:170px;border-radius:50%;background:conic-gradient(#fff,#cfe6ff,#fff,#ffd9e6,#fff,#d6f5e0,#fff);border:6px solid var(--ink);box-shadow:0 14px 30px rgba(30,60,110,.3);position:relative;animation:spin 7s linear infinite;animation-play-state:paused}
.disc.on{animation-play-state:running}
.disc:after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:var(--paper);border:4px solid var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.ctl{display:flex;gap:16px;align-items:center}
.ctl button{width:56px;height:56px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 12px rgba(0,0,0,.15);font-size:22px;color:var(--ink);transition:transform .12s}
.ctl button:active{transform:scale(.88)}
.ctl .big{width:72px;height:72px;background:linear-gradient(135deg,#2b8cff,#6a5cff);color:#fff;font-size:28px}
.pk{position:relative;display:flex;height:52%;width:100%;padding:0 8px;touch-action:none}
.pk .w{flex:1;margin:0 2px;border-radius:0 0 14px 14px;background:#fff;border:2px solid #17325c;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:800;color:#17325c;transition:all .08s;touch-action:none}
.pk .w.d{background:linear-gradient(#cfe6ff,#8fc4ff);transform:translateY(3px)}
.pk .bl{position:absolute;top:0;height:60%;width:9%;background:#17325c;border-radius:0 0 10px 10px;z-index:2;transition:all .08s;touch-action:none}
.pk .bl.d{background:#2b8cff;transform:translateY(3px)}

/* control center */
#ccbg{position:absolute;inset:0;z-index:70;display:none}
#ccbg.on{display:block}
#cc{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 14px);z-index:71;border-radius:32px;padding:16px;background:var(--glassb);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid rgba(255,255,255,.6);box-shadow:0 20px 50px rgba(20,40,90,.3);transform:translateY(-140%);transition:transform .5s cubic-bezier(.2,1.1,.3,1);max-height:80vh;overflow:auto;color:var(--ink)}
#cc.on{transform:none}
#cc .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{aspect-ratio:1;border-radius:20px;background:var(--glass);display:grid;place-items:center;font-size:28px;border:0;transition:all .2s;color:var(--ink)}
.tile:active{transform:scale(.88)}
.tile.on{background:var(--accent);box-shadow:0 6px 16px rgba(43,140,255,.5)}
#cc input[type=range]{width:100%;margin:16px 0 4px;accent-color:var(--accent)}
.cch{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;font-size:12px;font-weight:800;letter-spacing:2px;opacity:.7}
#nlist{display:flex;flex-direction:column;gap:8px}
#torch{position:absolute;inset:0;z-index:95;background:#fff;display:none;place-items:center;color:#999;font-size:15px}
#dimmer{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:98}
#banners{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;z-index:97;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.banner{pointer-events:auto;animation:bin .6s cubic-bezier(.2,1.3,.4,1) both}
.banner.out{animation:bout .4s forwards}
@keyframes bin{from{transform:translateY(-140%) scale(.9)}}
@keyframes bout{to{transform:translateY(-140%);opacity:0}}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translate(-50%,160px);background:rgba(20,28,50,.9);color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 22px;border-radius:30px;font-size:15px;font-weight:600;z-index:99;transition:transform .45s cubic-bezier(.2,1.3,.4,1);max-width:88%;text-align:center}
#toast.show{transform:translate(-50%,0)}
#fx{position:absolute;inset:0;z-index:120;pointer-events:none;overflow:hidden}
/* store */
.store-card{display:flex;align-items:center;gap:12px;padding:12px 14px}
.store-card .ico{width:54px;height:54px;flex:none;border-radius:14px}
.store-card b{display:block;font-size:16px}
.store-card small{opacity:.65;font-size:12.5px;display:block;line-height:1.25}
.get{border:0;border-radius:18px;padding:8px 14px;font-weight:800;font-size:14px;background:#e6efff;color:#2b6bff;position:relative;min-width:84px;font-family:inherit;flex:none;transition:transform .12s}
.get:active{transform:scale(.9)}
.get:first-of-type{margin-left:auto}
.get.in{background:#e6f9ec;color:#1a9c55}
.get.rm2{background:#ffeaea;color:#e0366c;min-width:0;padding:8px 11px}
.get.load{color:transparent;pointer-events:none}
.get.load:after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border:3px solid #2b6bff33;border-top-color:#2b6bff;border-radius:50%;animation:spin .7s linear infinite}
/* chat */
.msg{max-width:82%;padding:10px 14px;border-radius:20px;margin:6px 0;line-height:1.35;animation:cardin .3s both;font-size:16px;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.msg.bot{background:var(--card);border-bottom-left-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.msg.me{background:linear-gradient(135deg,#2b8cff,#6a5cff);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;margin:0 2px;animation:dotb 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dotb{50%{transform:translateY(-5px);opacity:1}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:16px;padding:8px 14px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.1);font-family:inherit}
/* weather */
.wxe{animation:bob2 2s infinite alternate}
.wx-big{font-size:90px;animation:bob2 2s infinite alternate;line-height:1}
.fc{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px}
/* clicker */
.dz{flex:1;border-radius:26px;display:grid;place-items:center;color:#fff;font-weight:900;text-align:center;touch-action:manipulation;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.dz .dn{font-size:84px;line-height:1}.dz .dl{font-size:15px;opacity:.9;letter-spacing:2px}
.dz:active{filter:brightness(1.15)}
/* tour */
#tour{position:absolute;inset:0;z-index:160;display:none}
#tour.on{display:block}
#tring{position:absolute;border-radius:24px;opacity:0;box-shadow:0 0 0 9999px rgba(10,20,50,.58);transition:all .5s cubic-bezier(.2,.9,.2,1);border:3px solid #fff;animation:pulse 1.3s infinite}
@keyframes pulse{50%{border-color:#ffd400}}
#tcard{position:absolute;left:18px;right:18px;padding:18px;border-radius:26px;background:var(--paper);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.4);transition:top .5s cubic-bezier(.2,.9,.2,1)}
#tcard h3{margin:0 0 6px;font-size:20px}#tcard p{margin:0 0 14px;line-height:1.4;opacity:.85}
#tplane{position:absolute;width:56px;transition:left .6s cubic-bezier(.2,.9,.2,1),top .6s cubic-bezier(.2,.9,.2,1);filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));animation:hover 3s ease-in-out infinite}
/* ===== СТИЛИ ===== */
.petal{position:absolute;top:-30px;font-size:18px;animation:fall linear infinite;opacity:.9}
@keyframes fall{to{transform:translate(90px,115vh) rotate(540deg)}}
/* pixel */
#phone[data-style=pixel]{font-family:"Courier New",ui-monospace,monospace;font-weight:700}
#phone[data-style=pixel]:not([data-theme=night]){--ink:#1a1a2e;--paper:#fff6d6;--card:#fff;--line:#1a1a2e;--glass:#fff;--glassb:#fff;--accent:#ff4d6d}
#phone[data-style=pixel] :is(.ico,.widget,.dock,.btn,.card,.nt,#cc,.tile,input.t,textarea.t,.get,.chip,.msg,#tcard,.dz,#doneBtn){border-radius:0!important}
#phone[data-style=pixel] .ico{border:3px solid #1a1a2e;box-shadow:4px 4px 0 #1a1a2e}
#phone[data-style=pixel] .ico:before{display:none}
#phone[data-style=pixel] :is(.widget,.dock,.nt,#cc,.card){backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:3px solid #1a1a2e!important;box-shadow:5px 5px 0 #1a1a2e!important;background:var(--glassb)!important}
#phone[data-style=pixel] .btn{border:3px solid #1a1a2e;box-shadow:3px 3px 0 #1a1a2e;background:var(--accent)}
#phone[data-style=pixel] .btn.g{background:#fff;color:#1a1a2e}
#phone[data-style=pixel]:not([data-theme=photo]):not([data-theme=night]) .wall{background:repeating-conic-gradient(#8fd3ff 0 25%,#79c4f6 0 50%) 0 0/36px 36px}
#phone[data-style=pixel] .cloud{display:none}
#phone[data-style=pixel] #lock .time{text-shadow:4px 4px 0 #ff4d6d}
/* comic */
#phone[data-style=comic]{font-family:"Comic Sans MS","Chalkboard SE","Marker Felt",cursive,sans-serif}
#phone[data-style=comic]:not([data-theme=night]){--ink:#111;--paper:#fff9e0;--card:#fff;--line:#111;--glass:#fffbe6;--glassb:#fffbe6;--accent:#ff3b5c}
#phone[data-style=comic] .ico{border:3px solid #111;box-shadow:4px 5px 0 #111;border-radius:18px}
#phone[data-style=comic] .ico:before{display:none}
#phone[data-style=comic] :is(.widget,.dock,.nt,#cc,.card,#tcard){backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:3px solid #111!important;box-shadow:5px 6px 0 #111!important;background:var(--glassb)!important;border-radius:22px}
#phone[data-style=comic] .btn{border:3px solid #111;box-shadow:3px 4px 0 #111;background:#ffe14d;color:#111}
#phone[data-style=comic] .btn.g{background:#fff}
#phone[data-style=comic]:not([data-theme=photo]):not([data-theme=night]) .wall{background:radial-gradient(circle,rgba(255,59,92,.35) 2.5px,transparent 3px) 0 0/16px 16px,linear-gradient(135deg,#ffe14d,#ff9a3d)}
#phone[data-style=comic] .cloud{display:none}
#phone[data-style=comic] #lock .time{text-shadow:4px 4px 0 #ff3b5c;-webkit-text-stroke:2px #111}
/* anime */
#phone[data-style=anime]:not([data-theme=night]){--ink:#5b2a6e;--paper:#fff3fa;--card:#fff;--line:rgba(91,42,110,.15);--glass:rgba(255,255,255,.5);--glassb:rgba(255,255,255,.78);--accent:#ff6ab0}
#phone[data-style=anime] .ico{border:2.5px solid #fff;border-radius:22px;box-shadow:0 0 18px rgba(255,106,176,.6),0 8px 16px rgba(91,42,110,.25)}
#phone[data-style=anime] :is(.widget,.dock,.nt,#cc){border:2px solid #fff!important;box-shadow:0 0 26px rgba(255,106,176,.4),0 10px 26px rgba(91,42,110,.18)!important}
#phone[data-style=anime] .btn{background:linear-gradient(135deg,#ff6ab0,#a78bfa);box-shadow:0 6px 16px rgba(255,106,176,.45)}
#phone[data-style=anime] .btn.g{background:var(--card)}
#phone[data-style=anime]:not([data-theme=photo]):not([data-theme=night]) .wall{background:radial-gradient(circle at 20% 15%,#fff8 0,transparent 25%),radial-gradient(circle at 80% 70%,#fff6 0,transparent 30%),linear-gradient(180deg,#ffd1ec 0%,#d9c8ff 50%,#c9e8ff 100%)}
#phone[data-style=anime] #lock .time{text-shadow:0 0 24px #ff6ab0,0 0 6px #fff}
#phone[data-style=anime] .cloud{background:#ffe3f3}
/* camera + recorder */
.fold{position:relative}
.fold:before{content:"";position:absolute;top:0;right:0;width:34px;height:34px;background:linear-gradient(225deg,var(--paper) 50%,rgba(0,0,0,.25) 50%);z-index:3;border-bottom-left-radius:8px;box-shadow:-3px 3px 6px rgba(0,0,0,.2);pointer-events:none}
.shut{width:78px;height:78px;border-radius:50%;border:5px solid var(--ink);background:transparent;position:relative;flex:none;transition:transform .1s}
.shut:after{content:"";position:absolute;inset:5px;border-radius:50%;background:linear-gradient(135deg,#fff,#cfe6ff);box-shadow:0 4px 10px rgba(30,60,110,.3);transition:transform .1s}
.shut:active{transform:scale(.92)}.shut:active:after{transform:scale(.86)}
.rnd{width:54px;height:54px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.15);flex:none;transition:transform .12s}
.rnd:active{transform:scale(.88)}.rnd.on{background:var(--accent);color:#fff}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal div{aspect-ratio:1;border-radius:12px;background:#ddd center/cover;box-shadow:0 3px 8px rgba(0,0,0,.18);animation:cardin .3s both}
.rec{width:150px;height:150px;border-radius:50%;border:6px solid var(--ink);background:radial-gradient(circle at 30% 25%,#fff,#ffd9e0);display:grid;place-items:center;font-size:62px;position:relative;box-shadow:0 12px 26px rgba(30,60,110,.3);transition:transform .1s;flex:none}
.rec:active{transform:scale(.94)}
.rec.on{background:radial-gradient(circle at 30% 25%,#ff9aa8,#ff3b5c);animation:recp 1s infinite}
@keyframes recp{50%{box-shadow:0 0 0 18px rgba(255,59,92,.22),0 12px 26px rgba(30,60,110,.3)}}
.clip{display:flex;align-items:center;gap:10px;padding:10px 12px}
.clip .rnd{width:44px;height:44px;font-size:18px}
.clip input{border:0;background:none;color:var(--ink);font-weight:800;font-size:15px;width:100%;outline:none;font-family:inherit;-webkit-user-select:text;user-select:text}
.clip small{opacity:.65;font-size:12px}
#boot{position:absolute;inset:0;z-index:200;background:linear-gradient(180deg,#6cc3ff,#eaf8ff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s .1s,transform .6s .1s;color:#17325c}
#boot.off{opacity:0;transform:scale(1.15);pointer-events:none}
#boot svg{width:96px;animation:bootfly 1.6s cubic-bezier(.3,.7,.2,1) both}
@keyframes bootfly{from{transform:translate(-120vw,60px) rotate(-30deg)}60%{transform:translate(0,-6px) rotate(6deg)}to{transform:translate(0,0) rotate(0)}}
#boot b{font-size:34px;letter-spacing:8px;font-weight:900;animation:fadein 1s .9s both}
#boot small{letter-spacing:4px;font-weight:700;opacity:.7;animation:fadein 1s 1.1s both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
</style>
</head>
<body>
<div id="phone" data-theme="sky">
  <div class="wall" id="wall"></div><div class="stars"></div>

  <div id="status"><span id="stime">9:41</span><span class="r"><span id="snote" style="display:none">♪</span><span>5G</span><span class="bat"><i></i></span></span></div>
  <button id="doneBtn">Готово</button>
  <div id="toast"></div>
  <div id="banners"></div>

  <div id="home" class="away">
    <div id="pager">
      <div class="page" id="p1">
        <div class="widget" id="wmain">
          <div><div class="t" id="wtime">--:--</div><div class="s" id="wdate"></div><div class="s">AIR OS · бумажный телефон</div></div>
          <div id="wplane"></div>
        </div>
        <div class="wrow"><div class="widget sm" id="wcal"></div><div class="widget sm" id="wtask"></div></div>
        <div class="sect">ПРИЛОЖЕНИЯ</div><div class="grid" id="g1"></div>
      </div>
      <div class="page" id="p2"><div class="widget" id="wweather" style="margin-top:2px"></div><div class="sect">ИНСТРУМЕНТЫ</div><div class="grid" id="g2"></div></div>
      <div class="page" id="p3"><div style="height:6px"></div><div class="sect">ИГРЫ AIR</div><div class="grid" id="g3"></div></div>
    </div>
    <div id="dots"><i class="on"></i><i></i><i></i></div>
    <div class="dock" id="dock"></div>
  </div>

  <div id="app"><div class="bar"></div><div class="body" id="appbody"></div><div class="home-ind" id="appclose"><i></i></div></div>

  <div id="lock">
    <div class="brand">AIR OS</div>
    <div class="date" id="ldate"></div>
    <div class="time" id="ltime">--:--</div>
    <div id="lgreet"></div>
    <div class="plane" id="lplane"></div>
    <div id="lnotes"></div>
    <div class="hint"><b>⌃</b>Проведи вверх, чтобы открыть</div>
    <div class="lockbar"></div>
  </div>

  <div id="ccbg"></div>
  <div id="cc">
    <div class="tiles">
      <button class="tile" id="tNight">🌙</button>
      <button class="tile" id="tTorch">🔦</button>
      <button class="tile" id="tMute">🔔</button>
      <button class="tile" id="tLock">🔒</button>
    </div>
    <input type="range" id="bright" min="30" max="100" value="100">
    <div style="text-align:center;font-size:12px;font-weight:700;opacity:.6">ЯРКОСТЬ</div>
    <div class="cch"><span>УВЕДОМЛЕНИЯ</span><button id="nclear" style="border:0;background:none;font-weight:800;color:var(--ink);opacity:.8">Очистить</button></div>
    <div id="nlist"></div>
  </div>
  <div id="torch">Нажми, чтобы выключить фонарик</div>
  <div id="dimmer"></div>
  <div id="fx"></div>

  <div id="tour"></div>
  <div id="boot"><div id="bplane"></div><b>AIR OS</b><small>PAPER PHONE</small></div>
</div>

<script>
const VERSION='2.2';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('air_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('air_'+k,JSON.stringify(v));return true}catch(e){return false}}};
const PLANE='<svg viewBox="0 0 64 64"><path d="M4 30 60 6 44 58 32 40z" fill="#fff" stroke="#17325c" stroke-width="3" stroke-linejoin="round"/><path d="M60 6 32 40 30 54 44 58z" fill="#cfe6ff" stroke="#17325c" stroke-width="3" stroke-linejoin="round"/><path d="M32 40 60 6" stroke="#17325c" stroke-width="2.5"/></svg>';
['#wplane','#lplane','#bplane'].forEach(s=>$(s).innerHTML=PLANE);
const pad2=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());

/* ===== ЗВУКИ ===== */
let AC=null,master=null,ana=null,muted=store.get('muted',false);
function actx(){
 if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.85;ana=AC.createAnalyser();ana.fftSize=64;master.connect(ana);ana.connect(AC.destination)}
 if(AC.state==='suspended')AC.resume();return AC;
}
document.addEventListener('pointerdown',()=>{try{actx()}catch(e){}},{passive:true});
function tone(f,d=.15,type='sine',v=.15,at=0,f2){
 if(muted)return;try{const c=actx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+at;
 o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}catch(e){}
}
function noise(d=.15,f1=2000,f2=2000,v=.2,at=0){
 if(muted)return;try{const c=actx(),n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=1.1;const t=c.currentTime+at;
 f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+d);
 const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.25);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(f);f.connect(g);g.connect(master);s.start(t)}catch(e){}
}
function beep(f=880,ms=200){tone(f,ms/1000,'sine',.15)}
function buzz(n=10){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
const sfx={
 tap(){noise(.05,3500,3500,.16);tone(1400,.04,'triangle',.05)},
 open(){noise(.32,600,3800,.2)},
 close(){noise(.28,3800,500,.17)},
 unlock(){[660,880,1320].forEach((f,i)=>tone(f,.28,'sine',.12,i*.07))},
 lock(){tone(880,.15,'sine',.1);tone(550,.22,'sine',.1,.08)},
 notify(){tone(988,.14,'sine',.14);tone(1319,.26,'sine',.12,.12)},
 pick(){tone(520,.1,'triangle',.12,0,780);noise(.08,4000,5000,.1)},
 drop(){tone(420,.12,'triangle',.12,0,260);noise(.08,2500,2500,.12)},
 crumple(){for(let i=0;i<6;i++)noise(.05,1500+Math.random()*4000,2500,.18,i*.035)},
 win(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.14,i*.09))},
 lose(){tone(330,.35,'sawtooth',.08,0,150)},
 swoosh(){noise(.22,900,2600,.12)},
 flap(){tone(380,.09,'triangle',.1,0,700)}
};

/* ===== ЭФФЕКТЫ ===== */
function confetti(x=innerWidth/2,y=innerHeight/2.2,n=40){
 const fx=$('#fx'),cols=['#fff','#cfe6ff','#ffd400','#ff8a5c','#6cc3ff','#ff8aa5','#9be8b0'];
 for(let i=0;i<n;i++){const p=document.createElement('i');
  p.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${6+Math.random()*8}px;height:${10+Math.random()*10}px;background:${cols[i%cols.length]};border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3)`;
  fx.appendChild(p);const a=Math.random()*Math.PI*2,v=100+Math.random()*260,dx=Math.cos(a)*v,dy=Math.sin(a)*v-140;
  p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy+480}px) rotate(${Math.random()*900-450}deg)`,opacity:0}],{duration:1400+Math.random()*900,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>p.remove()}
}
function flyPlane(x,y,dx=(Math.random()<.5?-1:1)*(260+Math.random()*160),dy=-260-Math.random()*200){
 const p=document.createElement('div');p.style.cssText=`position:absolute;left:${x-18}px;top:${y-18}px;width:36px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))`;p.innerHTML=PLANE;$('#fx').appendChild(p);
 const ang=Math.atan2(dy,dx)*180/Math.PI+40;
 p.animate([{transform:'translate(0,0) rotate('+ang+'deg) scale(.4)',opacity:0},{opacity:1,offset:.15},{transform:`translate(${dx*.5}px,${dy*.7}px) rotate(${ang-8}deg) scale(1)`,offset:.6},{transform:`translate(${dx}px,${dy}px) rotate(${ang+6}deg) scale(.8)`,opacity:0}],{duration:1600,easing:'ease-out'}).onfinish=()=>p.remove();
 sfx.swoosh();
}

/* ===== УВЕДОМЛЕНИЯ ===== */
const NOTIFS=[];
function ntHTML(n){return `<div class="e">${n.e||'✈️'}</div><div><b>${n.t}</b><span>${n.b||''}</span></div>`}
function notify(o){
 NOTIFS.unshift(o);if(NOTIFS.length>20)NOTIFS.pop();sfx.notify();buzz([30,40,30]);
 renderLockNotes();
 if(!$('#lock').classList.contains('gone'))return;
 const b=document.createElement('div');b.className='nt banner';b.innerHTML=ntHTML(o);$('#banners').appendChild(b);
 const kill=()=>{b.classList.add('out');setTimeout(()=>b.remove(),400)};
 b.addEventListener('click',()=>{kill();if(o.app)openApp({app:o.app},document.querySelector('.ico'))});
 setTimeout(kill,4200);
}
function renderLockNotes(){$('#lnotes').innerHTML=NOTIFS.slice(0,3).map(n=>`<div class="nt">${ntHTML(n)}</div>`).join('')}
function renderNotifs(){$('#nlist').innerHTML=NOTIFS.length?NOTIFS.slice(0,6).map(n=>`<div class="nt">${ntHTML(n)}</div>`).join(''):'<div style="opacity:.55;font-size:14px;text-align:center;padding:8px">Нет уведомлений</div>'}
$('#nclear').addEventListener('click',()=>{NOTIFS.length=0;renderNotifs();renderLockNotes();sfx.crumple()});

/* ===== ОБОИ ===== */
(function(){
 const w=$('#wall');
 for(let i=0;i<6;i++){const c=document.createElement('div');c.className='cloud';c.style.top=(5+Math.random()*80)+'%';c.style.animationDuration=(40+Math.random()*40)+'s';c.style.animationDelay=(-Math.random()*60)+'s';c.style.transform='scale('+(.6+Math.random())+')';w.appendChild(c)}
 for(let i=0;i<3;i++){const f=document.createElement('div');f.className='fly';f.innerHTML=PLANE;f.style.top=(15+Math.random()*60)+'%';f.style.animationDuration=(22+Math.random()*14)+'s';f.style.animationDelay=(-Math.random()*30)+'s';w.appendChild(f)}
})();
function applyTheme(){
 let t=store.get('theme','sky');const photo=store.get('photo',null);if(t==='photo'&&!photo)t='sky';
 const ph=$('#phone');ph.dataset.theme=t;
 if(t==='photo'){ph.dataset.tone=store.get('tone','light')==='dark'?'dark':'light';$('#wall').style.backgroundImage=`url(${photo})`}
 else{delete ph.dataset.tone;$('#wall').style.backgroundImage=''}
 $('#tNight').classList.toggle('on',t==='night');
 document.querySelector('meta[name=theme-color]').content=t==='night'?'#0a1030':'#8fd3ff';
}
function setTheme(t){store.set('theme',t);applyTheme()}
function setPhoto(file){
 const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);const url=c.toDataURL('image/jpeg',.8);
  const t=document.createElement('canvas');t.width=t.height=16;const tx=t.getContext('2d');tx.drawImage(im,0,0,16,16);const d=tx.getImageData(0,0,16,16).data;let l=0;for(let i=0;i<d.length;i+=4)l+=.299*d[i]+.587*d[i+1]+.114*d[i+2];l/=256;
  if(store.set('photo',url)){store.set('tone',l<135?'dark':'light');setTheme('photo');toast('Обои установлены! 🖼️');sfx.win()}else toast('Фото слишком большое для памяти')};
  im.onerror=()=>toast('Не получилось открыть фото');im.src=fr.result};
 fr.readAsDataURL(file);
}
applyTheme();

/* ===== ПРИЛОЖЕНИЯ ===== */

  const k=b.dataset.k;sfx.tap();

  else if(k==='='){try{const ex=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(/^[\d+\-*/.() ]+$/.test(ex)){s=String(+Function('return '+ex)().toFixed(8));tone(880,.12,'sine',.1)}}catch(e){s='Ошибка'}}

 }));

 function render(){const gg=$('#gg');gg.innerHTML='';g.forEach(v=>{const d=document.createElement('div');if(v){d.textContent=v;d.style.background=col[v]||'#222';d.animate([{transform:'scale(.85)'},{transform:'scale(1)'}],{duration:150})}gg.appendChild(d)});$('#sc').textContent=score;$('#bs').textContent=best}
 function init(){g=Array(16).fill(0);score=0;add();add();render()}
 function mv(dir){
  const lines=[];for(let a=0;a<4;a++){const l=[];for(let b=0;b<4;b++)l.push(dir==='l'?a*4+b:dir==='r'?a*4+3-b:dir==='u'?b*4+a:(3-b)*4+a);lines.push(l)}
  let moved=false,merged=false;
  lines.forEach(l=>{let v=l.map(i=>g[i]).filter(Boolean);for(let i=0;i<v.length-1;i++)if(v[i]===v[i+1]){v[i]*=2;score+=v[i];v.splice(i+1,1);merged=true}while(v.length<4)v.push(0);l.forEach((idx,k)=>{if(g[idx]!==v[k]){moved=true;g[idx]=v[k]}})});
  if(!moved)return;add();noise(.07,2500,1800,.1);if(merged)tone(600+Math.min(score,2000)/4,.1,'triangle',.1);

 }

snake(root){
 root.innerHTML='<canvas style="width:100%;height:100%;display:block;touch-action:none"></canvas>';
 const c=root.firstChild,x=c.getContext('2d');const W=c.width=root.clientWidth*2,H=c.height=root.clientHeight*2;
 const N=16,cs=Math.floor(W/N),R=Math.floor(H/cs);let s,dir,nd,food,alive=false,score=0,iv,best=store.get('snakebest',0);
 function start(){s=[{x:8,y:Math.floor(R/2)},{x:7,y:Math.floor(R/2)},{x:6,y:Math.floor(R/2)}];dir=nd='r';score=0;alive=true;place();clearInterval(iv);iv=setInterval(step,120)}
 function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*R)}}while(s.some(p=>p.x===food.x&&p.y===food.y))}
 function step(){
  dir=nd;const h={...s[0]};if(dir==='r')h.x++;if(dir==='l')h.x--;if(dir==='u')h.y--;if(dir==='d')h.y++;
  if(h.x<0||h.y<0||h.x>=N||h.y>=R||s.some(p=>p.x===h.x&&p.y===h.y)){alive=false;clearInterval(iv);buzz(80);sfx.lose();if(score>best){best=score;store.set('snakebest',best);sfx.win();confetti();notify({t:'Рекорд в Змейке! 🐍',b:'Счёт: '+best,e:'🏆',app:'snake'})}draw();return}
  s.unshift(h);if(h.x===food.x&&h.y===food.y){score++;tone(700+score*20,.07,'triangle',.12);place()}else s.pop();draw();
 }
 function draw(){
  x.fillStyle='#eaf8ff';x.fillRect(0,0,W,H);
  for(let i=0;i<N;i++)for(let j=0;j<R;j++)if((i+j)%2){x.fillStyle='rgba(43,140,255,.07)';x.fillRect(i*cs,j*cs,cs,cs)}
  if(s){s.forEach((p,i)=>{x.fillStyle=i?'#2b8cff':'#17325c';x.beginPath();x.roundRect(p.x*cs+3,p.y*cs+3,cs-6,cs-6,10);x.fill()});
   x.font=cs*.8+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('⭐',food.x*cs+cs/2,food.y*cs+cs/2+2)}
  x.fillStyle='#17325c';x.font='900 60px sans-serif';x.textAlign='left';x.textBaseline='top';x.fillText('Счёт '+score+'  ·  рекорд '+best,20,16);
  if(!alive){x.textAlign='center';x.font='800 48px sans-serif';x.fillText(s?'Конец! Тапни, чтобы заново':'Тапни, чтобы начать',W/2,H/2)}
 }
 c.addEventListener('pointerdown',()=>{if(!alive)start()});
 swipe(c,d=>{const o={r:'l',l:'r',u:'d',d:'u'};if(d!==o[dir])nd=d},18);
 draw();cleanups.push(()=>clearInterval(iv));
},

async function geo(name){const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ru&name='+encodeURIComponent(name));const j=await r.json();if(!j.results||!j.results.length)throw new Error('nf');const x=j.results[0];return{city:x.name,lat:x.latitude,lon:x.longitude}}
async function fetchWx(loc){const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`);const j=await r.json();return{...loc,cur:j.current,daily:j.daily,ts:Date.now()}}
async function loadWeather(force){
 const loc=store.get('wxloc',null);if(!loc){renderWxWidget();return null}
 const c=store.get('wx',null);if(!force&&c&&Date.now()-c.ts<1800000){renderWxWidget();return c}
 try{const d=await fetchWx(loc);store.set('wx',d);renderWxWidget();return d}catch(e){renderWxWidget();return c}
}

  if(st==='play'){
   bx+=vx;by+=vy;if(bx<r||bx>W-r){vx=-vx;bx=Math.max(r,Math.min(W-r,bx));tone(400,.04,'triangle',.08)}

   if(vy<0&&by-r<=ay+PH&&by-r>=ay-20&&bx>ax-r&&bx<ax+PW+r){vy=Math.abs(vy)*1.03;vx+=(bx-(ax+PW/2))*.08;by=ay+PH+r;tone(500,.06,'triangle',.1)}
   vx=Math.max(-22,Math.min(22,vx));
   if(by>H+40){ai++;sfx.lose();st='ready';serve(-1);buzz(60)}
   if(by<-40){me++;sfx.win();st='ready';serve(1)}
   if(me>=5||ai>=5){st='over';if(me>=5){confetti();notify({t:'Пинг-понг: победа! 🏓',b:me+':'+ai,e:'🏆',app:'pong'})}}
  }

const PX=document.createElement('canvas');
function frame(x,v,w,h,mirror,f){
 const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return;
 const s=Math.max(w/vw,h/vh),sw=w/s,sh=h/s,sx=(vw-sw)/2,sy=(vh-sh)/2;
 x.save();if(mirror){x.translate(w,0);x.scale(-1,1)}
 if(f==='pixel'){const k=Math.max(4,Math.round(w/70)),tw=Math.ceil(w/k),th=Math.ceil(h/k);PX.width=tw;PX.height=th;PX.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,tw,th);x.imageSmoothingEnabled=false;x.drawImage(PX,0,0,tw,th,0,0,w,h)}
 else x.drawImage(v,sx,sy,sw,sh,0,0,w,h);
 x.restore();
 if(f!=='none'){
  const d=x.getImageData(0,0,w,h),p=d.data,q=(v,n)=>Math.round(v/n)*n;
  for(let i=0;i<p.length;i+=4){let r=p[i],g=p[i+1],b=p[i+2];
   if(f==='paper'){const y=.3*r+.59*g+.11*b;r=y*1.1+16;g=y*1.02+8;b=y*.82;r=(r-128)*1.12+128;g=(g-128)*1.12+128;b=(b-128)*1.12+128}
   else if(f==='anime'){const y=(r+g+b)/3;r=y+(r-y)*1.7+14;g=y+(g-y)*1.7+14;b=y+(b-y)*1.7+22}
   else if(f==='comic'){r=q((r-128)*1.5+128,85);g=q((g-128)*1.5+128,85);b=q((b-128)*1.5+128,85)}
   else if(f==='pixel'){r=q(r,51);g=q(g,51);b=q(b,51)}
   p[i]=r;p[i+1]=g;p[i+2]=b}
  x.putImageData(d,0,0);
 }
}

let updChecked=false;
async function autoUpd(){if(updChecked)return;updChecked=true;try{const v=await remoteVersion();if(v&&v!==VERSION)notify({t:'Доступно обновление AIR OS',b:'Версия '+v+' — установи в настройках',e:'🔄',app:'settings'})}catch(e){}}
function doUpdate(){toast('Обновляю AIR OS…');sfx.swoosh();flyPlane(innerWidth/2,innerHeight/2);setTimeout(()=>location.replace(location.pathname+'?u='+Date.now()),900)}

applyStyle();loadWeather(false);

/* иконка для экрана Домой */
(function(){
 const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,0,180);g.addColorStop(0,'#4aa8ff');g.addColorStop(1,'#d8f1ff');x.fillStyle=g;x.fillRect(0,0,180,180);
 x.fillStyle='#fff';x.strokeStyle='#17325c';x.lineWidth=7;x.lineJoin='round';
 x.beginPath();x.moveTo(26,86);x.lineTo(156,26);x.lineTo(112,152);x.lineTo(84,106);x.closePath();x.fill();x.stroke();
 x.beginPath();x.moveTo(156,26);x.lineTo(84,106);x.lineTo(80,140);x.lineTo(112,152);x.closePath();x.fillStyle='#cfe6ff';x.fill();x.stroke();
 const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);
})();

/* подсказки раз в 100 секунд */
const TIPS=['Зажми иконку, чтобы переставить приложения','Тапни по часам вверху — откроется центр управления','Тапни по пустому месту — полетит самолётик ✈️','Свои фото можно поставить на обои в настройках','В «Музыке» играют мелодии, которые сочиняет сам телефон'];
setInterval(()=>{if(lock.classList.contains('gone')&&!editing&&!$('#app').classList.contains('open'))notify({t:'Подсказка AIR',b:TIPS[Math.floor(Math.random()*TIPS.length)],e:'💡'})},100000);

/* загрузка */
setTimeout(()=>{$('#boot').classList.add('off');setTimeout(()=>$('#boot').remove(),900)},2300);
const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
if(!standalone)setTimeout(()=>toast('«Поделиться» → «На экран Домой», чтобы установить AIR OS'),3600);
</script>
</body>
</html>
